<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Lab</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js",
          "three/addons/": "../../node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="3" fill="#8052ff" />
            <g stroke="#8052ff" stroke-width="1.4" fill="none">
              <ellipse cx="16" cy="16" rx="13" ry="5.5" />
              <ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(60 16 16)" />
              <ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(120 16 16)" />
            </g>
          </svg>
          <span class="name">QUANTUM&nbsp;LAB</span>
          <span class="tag">Algorithm Workbench</span>
        </div>
        <div class="spacer"></div>
        <button class="iconbtn" id="btnPresent" title="Modo presentación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
        </button>
        <button class="iconbtn" id="btnSettings" title="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
        <span class="chip" id="backendChip">C++ · Eigen3 · ZeroMQ</span>
        <span class="chip"
          ><span class="led" id="engineLed"></span><span id="engineText">conectando…</span></span
        >

        <!-- Popover de ajustes -->
        <div class="popover" id="settings" hidden>
          <div class="pop-h">Ajustes</div>
          <div class="field">
            <label>Resplandor (bloom) <b id="set_bloomV">0.70</b></label>
            <input id="set_bloom" type="range" min="0" max="1.6" step="0.05" value="0.7" />
          </div>
          <div class="field">
            <label>Velocidad por defecto <b id="set_speedV">1×</b></label>
            <input id="set_speed" type="range" min="0" max="3" step="1" value="1" />
          </div>
          <label class="switch">
            <input id="set_particles" type="checkbox" checked />
            <span>Partículas y resplandor de eventos</span>
          </label>
          <label class="switch">
            <input id="set_autorot" type="checkbox" checked />
            <span>Rotación automática de cámara</span>
          </label>
        </div>
      </header>

      <aside class="rail-left" id="railLeft"></aside>

      <main class="stage">
        <canvas id="viewport"></canvas>
        <div class="hud" id="hud">
          <div class="htitle" id="hudTitle">Grover</div>
          <div class="hsub" id="hudSub">búsqueda cuántica</div>
          <div class="step-pills" id="hudPills"></div>
        </div>
        <div class="circuit-panel" id="circuitPanel">
          <div class="circuit-h">
            <span>Circuito</span>
            <div class="circuit-h-right">
              <span class="circuit-note" id="circuitNote"></span>
              <button class="circuit-toggle" id="circuitToggle" title="Mostrar/ocultar">−</button>
            </div>
          </div>
          <div class="circuit-body" id="circuit"></div>
        </div>
        <div class="playback" id="playback"></div>
        <div class="hint">Arrastra para rotar · rueda para zoom</div>
        <div class="legend" id="legend"></div>
      </main>

      <aside class="rail-right" id="railRight"></aside>

      <footer class="statusbar" id="statusbar"></footer>
    </div>

    <!-- Tooltip pedagógico global -->
    <div class="tooltip" id="tooltip" hidden></div>

    <!-- Overlay del modo presentación -->
    <div class="present-overlay" id="presentOverlay" hidden>
      <div class="present-info">
        <span class="present-badge">MODO PRESENTACIÓN</span>
        <span id="presentName">—</span>
      </div>
      <button class="present-exit" id="presentExit">Salir (Esc)</button>
    </div>

    <script type="module" src="scene.js"></script>
  </body>
</html>
