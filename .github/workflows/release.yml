name: Build Windows installer

# Compila el motor C++ en un runner Windows real (MSVC + vcpkg) y empaqueta la
# app Electron con electron-builder, publicando el instalador .exe como release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:   # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write       # necesario para crear el release y subir el .exe

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Motor C++ (Eigen3 + ZeroMQ + msgpack + nlohmann-json) vía vcpkg ---
      - name: Setup vcpkg dependencies
        run: |
          vcpkg install zeromq cppzmq msgpack-cxx eigen3 nlohmann-json gtest --triplet x64-windows
        shell: pwsh

      - name: Configure & build engine (Release)
        run: |
          cmake -B build -S packages/core-engine -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release --target quantum-engine
        shell: pwsh

      - name: Stage engine binary (+ ZeroMQ runtime DLLs)
        run: |
          $dst = "packages/electron-app/engine-bin"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item build/Release/quantum-engine.exe $dst -Force
          # DLLs de runtime que vcpkg produce (libzmq y dependencias)
          Get-ChildItem build/Release -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dst -Force
          $vbin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          if (Test-Path $vbin) { Get-ChildItem $vbin -Filter *.dll | Copy-Item -Destination $dst -Force }
          Get-ChildItem $dst
        shell: pwsh

      # --- App Electron + empaquetado ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & package (electron-builder → NSIS .exe)
        working-directory: packages/electron-app
        run: |
          npm install
          npx electron-builder --win nsis --publish never
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumLab-Windows-Installer
          path: packages/electron-app/dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Quantum Lab ${{ github.ref_name }} (preview)
          files: packages/electron-app/dist/*.exe
          generate_release_notes: true
