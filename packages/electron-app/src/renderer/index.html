<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Lab</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Capa de inmersión: sobrescribe el layout por overlays sobre el lienzo. -->
    <link rel="stylesheet" href="immersion.css" />
  </head>
  <body>
    <div id="app">
      <header class="appbar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="3" fill="#8052ff" />
            <g stroke="#8052ff" stroke-width="1.4" fill="none">
              <ellipse cx="16" cy="16" rx="13" ry="5.5" />
              <ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(60 16 16)" />
              <ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(120 16 16)" />
            </g>
          </svg>
          <span class="name">QUANTUM&nbsp;LAB</span>
          <span class="tag">Algorithm Workbench</span>
        </div>
        <div class="spacer"></div>
        <button class="iconbtn" id="btnPresent" title="Modo presentación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M8 21h8M12 17v4" />
          </svg>
        </button>
        <button class="iconbtn" id="btnSettings" title="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
        <span class="chip" id="backendChip">C++ · Eigen3 · ZeroMQ</span>
        <span class="chip"
          ><span class="led" id="engineLed"></span><span id="engineText">conectando…</span></span
        >
      </header>

      <!-- Popover de ajustes: fuera de la appbar para poder cubrir los paneles
           (dentro quedaba atrapado en el contexto de apilamiento del header). -->
      <div class="popover" id="settings" hidden>
        <div class="pop-h">Ajustes</div>
        <div class="field">
          <label>Resplandor (bloom) <b id="set_bloomV">0.70</b></label>
          <input id="set_bloom" type="range" min="0" max="1.6" step="0.05" value="0.7" />
        </div>
        <div class="field">
          <label>Velocidad por defecto <b id="set_speedV">1×</b></label>
          <input id="set_speed" type="range" min="0" max="3" step="1" value="1" />
        </div>
        <label class="switch">
          <input id="set_particles" type="checkbox" checked />
          <span>Partículas y resplandor de eventos</span>
        </label>
        <label class="switch">
          <input id="set_autorot" type="checkbox" checked />
          <span>Rotación automática de cámara</span>
        </label>
        <label class="switch">
          <input id="set_lite" type="checkbox" />
          <span>Alto rendimiento (menos efectos)</span>
        </label>
        <label class="switch">
          <input id="set_teach" type="checkbox" />
          <span>Modo enseñanza (pausa en cada paso)</span>
        </label>
        <div class="pop-actions">
          <button class="pop-btn" id="set_capture">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <rect x="3" y="6" width="18" height="13" rx="2" />
              <circle cx="12" cy="12.5" r="3.2" />
              <path d="M8 6l1.5-2h5L16 6" />
            </svg>
            Capturar imagen
          </button>
          <button class="pop-btn" id="set_export">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <path d="M12 3v12M8 11l4 4 4-4" />
              <path d="M5 21h14" />
            </svg>
            Exportar datos (CSV)
          </button>
        </div>
      </div>

      <div class="shell">
        <aside class="nav-col" id="railLeft"></aside>

        <main class="canvas-col">
          <div class="canvas-header">
            <div class="chead-left">
              <span class="chead-title" id="hudTitle">Grover</span>
              <span class="chead-sub" id="hudSub">búsqueda cuántica</span>
              <div class="step-pills" id="hudPills"></div>
            </div>
            <div class="segmented" id="segmented">
              <button class="seg active" id="seg3d" data-view="3d">Vista 3D</button>
              <button class="seg" id="segcirc" data-view="circuit">Circuito</button>
            </div>
          </div>

          <div class="canvas-area" id="canvasArea">
            <canvas id="viewport"></canvas>
            <div class="view-circuit" id="circuitView" hidden>
              <div class="circuit-note" id="circuitNote"></div>
              <div class="circuit-scroll"><div class="circuit-body" id="circuit"></div></div>
            </div>
            <div class="caption" id="caption" hidden>
              <div class="cap-kicker" id="capKicker"></div>
              <div class="cap-body" id="capBody"></div>
              <div class="cap-watch" id="capWatch"></div>
            </div>
            <div class="hint" id="viewHint">Arrastra para rotar · rueda para zoom</div>
            <div class="legend" id="legend"></div>
          </div>

          <div class="canvas-footer">
            <div class="playback" id="playback"></div>
            <div class="statusbar" id="statusbar"></div>
            <button class="ghost-btn" id="btnConsole" title="Consola (Esc)">
              <svg
                viewBox="0 0 24 24"
                width="15"
                height="15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M7 10l2.5 2L7 14" />
                <path d="M12.5 14h4" />
              </svg>
              Consola
            </button>
          </div>
        </main>

        <aside class="insp-col" id="railRight"></aside>

        <section class="console-drawer" id="consoleDrawer">
          <div class="cd-head">
            <span>Consola</span>
            <button class="cd-close" id="consoleClose" title="Cerrar (Esc)">✕</button>
          </div>
          <div class="console" id="console"></div>
        </section>
      </div>
    </div>

    <!-- Tooltip pedagógico global -->
    <div class="tooltip" id="tooltip" hidden></div>

    <!-- Overlay del modo presentación -->
    <div class="present-overlay" id="presentOverlay" hidden>
      <div class="present-info">
        <span class="present-badge">MODO PRESENTACIÓN</span>
        <span id="presentName">—</span>
      </div>
      <button class="present-exit" id="presentExit">Salir (Esc)</button>
    </div>

    <!-- Bundle autocontenido (three + addons + módulos del renderer) generado
         por esbuild (npm run bundle). No depende de node_modules en runtime. -->
    <script type="module" src="scene.bundle.js"></script>
    <!-- Comportamiento de inmersión (idle fade + autohide). No usa módulos. -->
    <script src="immersion.js"></script>
  </body>
</html>
